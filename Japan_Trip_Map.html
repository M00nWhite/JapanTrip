        .filter-btn {

            background-color: #34495e;
            color: white;
            border: 1px solid #45627d;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .filter-btn:hover { background-color: #4ca1af; }
        .filter-btn.active { background-color: #2980b9; font-weight: bold; }
        #map {
            flex-grow: 1;
            height: 100vh;
        }
        /* Style personnalisé pour les émojis sur la carte */

            font-size: 24px;
            text-align: center;
            line-height: 24px;
            background: rgba(255,255,255,0.8);

        let currentMarkers = [];
        let polyline = null;

        // Génération automatique des boutons de jours
        const dayButtonsContainer = document.getElementById('day-buttons');
        for (let i = 1; i <= 15; i++) {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerHTML = `Jour ${i}`;
            btn.onclick = (e) => filterMap(i, e.target);
            dayButtonsContainer.appendChild(btn);
        }

        // Fonction pour filtrer l'affichage
        function filterMap(day, buttonElement = null) {
            // Gestion de la couleur des boutons
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(buttonElement) {
                buttonElement.classList.add('active');
            } else {
                document.querySelector('.filter-btn').classList.add('active'); // Bouton "all"
            }

            // Nettoyage de la carte
            currentMarkers.forEach(marker => map.removeLayer(marker));
            currentMarkers = [];
            if(polyline) map.removeLayer(polyline);

            // Filtrage des lieux
            const filteredLocations = day === 'all' 
                ? locations 
                : locations.filter(loc => loc.day === day);

            const latlngs = [];

            // Ajout des nouveaux marqueurs
            filteredLocations.forEach(loc => {
                const customIcon = L.divIcon({
                    html: loc.icon,
                    className: 'custom-emoji-icon',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                const marker = L.marker([loc.lat, loc.lng], {icon: customIcon})
                    .bindPopup(`<b>Jour ${loc.day}</b><br>${loc.name}`)
                    .addTo(map);
                
                currentMarkers.push(marker);
                latlngs.push([loc.lat, loc.lng]);
            });

            // Ajout de la ligne du trajet et zoom automatique
            if (latlngs.length > 0) {
                polyline = L.polyline(latlngs, {color: '#e74c3c', weight: 3, dashArray: '5, 10'}).addTo(map);
                const bounds = L.latLngBounds(latlngs);
                map.fitBounds(bounds, {padding: [50, 50], maxZoom: 14});
            }
        }

        // Charger tout par défaut au lancement
        filterMap('all');
